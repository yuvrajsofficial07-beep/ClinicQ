<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicQ — Operator Panel</title>
<style>
:root{--blue:#1769ff;--dark:#17324d;--muted:#64788a;--bg:#f4f8fc;--line:#e2eaf2;--green:#18864b;--orange:#9a6500;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 16px;font-weight:750;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#e9f1ff;color:#1258c4}.outline{background:#fff;border:1px solid var(--line);color:var(--dark)}.danger{background:#ffe9e7;color:var(--red)}
.wrap{max-width:900px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:24px;font-weight:900}.logo span{color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #17324d0a}
.kpi{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f5}.kpi:last-child{border-bottom:0}.kpi b{font-size:18px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:750;background:#eaf7ef;color:var(--green)}.warning{background:#fff4d5;color:var(--orange)}
.bignum{font-size:48px;font-weight:950;color:var(--blue)}
.connbar{background:#b42318;color:#fff;text-align:center;font-size:12px;padding:8px;border-radius:10px;margin-bottom:14px}
.hidden{display:none!important}
.loginWrap{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 5px 18px #17324d0a}
.loginWrap label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}
.loginWrap input{width:100%;border:1px solid #ccd9e5;border-radius:12px;padding:12px;outline:none}
.loginErr{color:var(--red);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div id="connbar" class="connbar hidden">⚠ Firebase not configured yet — see FIREBASE_SETUP_NOTES.md</div>

<div id="loginScreen" class="loginWrap">
  <div class="logo center" style="text-align:center">Clinic<span>Q</span></div>
  <p id="loginTitle" style="text-align:center;color:var(--muted)">Doctor / Operator Login</p>
  <label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com">
  <label>Password</label><input id="loginPass" type="password">
  <button id="loginBtn" class="primary" style="width:100%;margin-top:16px" onclick="doLogin()">Login</button>
  <div id="loginErr" class="loginErr"></div>
  <p style="text-align:center;margin-top:14px;font-size:13px">
    <span id="modeLoginText">New here? </span><a href="#" id="modeToggle" onclick="toggleAuthMode();return false;">Create Account</a>
  </p>
</div>

<div id="profileSetupScreen" class="loginWrap hidden" style="max-width:480px">
  <div class="logo center" style="text-align:center">Clinic<span>Q</span></div>
  <p style="text-align:center;color:var(--muted)">Set up your Doctor Profile</p>
  <label>Doctor Name</label><input id="pfName" placeholder="Dr. Full Name">
  <label>Specialty</label><input id="pfSpecialty" placeholder="e.g. Neurologist">
  <label>Qualifications (comma separated)</label><input id="pfQual" placeholder="MBBS, MD">
  <label>Experience</label><input id="pfExp" placeholder="e.g. 10 Years Experience">
  <label>Clinic Name</label><input id="pfClinic" placeholder="Clinic name">
  <label>Clinic Address</label><input id="pfAddress" placeholder="Clinic address">
  <label>Working Hours</label><input id="pfHours" placeholder="e.g. 10:00 AM – 2:00 PM">
  <label>Consultation Fee (₹)</label><input id="pfFee" type="number" placeholder="500">
  <p class="small">Platform fee and ClinicQ service fee are added automatically — you don't need to set these.</p>
  <button class="primary" style="width:100%;margin-top:10px" onclick="createDoctorProfile()">Create Profile & Start</button>
  <div id="profileErr" class="loginErr"></div>
</div>

<div id="mainScreen" class="hidden">
<header><div class="logo">Clinic<span>Q</span> — Operator Panel</div>
  <div><button class="outline" onclick="callNext()">Call Next Token ▶</button>
  <button class="outline" onclick="doLogout()">Logout</button></div>
</header>
<div id="app"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
/* PASTE THE SAME FIREBASE CONFIG AS patient-app.html */
const firebaseConfig = {
  apiKey: "AIzaSyDsk5VfH0d2UWa_60E_UxQbCCRLDzFsiGA",
  authDomain: "clinic-a4513.firebaseapp.com",
  projectId: "clinic-a4513",
  storageBucket: "clinic-a4513.firebasestorage.app",
  messagingSenderId: "949075919558",
  appId: "1:949075919558:web:aad21915e2cea6e5588dc7",
  measurementId: "G-JZV455CNCV"
};

let fb = { ready:false };
try{
  if(firebaseConfig.apiKey!=="REPLACE_ME"){
    firebase.initializeApp(firebaseConfig);
    fb.db = firebase.firestore();
    fb.auth = firebase.auth();
    fb.ready = true;
  } else {
    document.getElementById("connbar").classList.remove("hidden");
  }
}catch(e){ console.error(e); document.getElementById("connbar").classList.remove("hidden"); }

let authMode = "login"; // "login" | "signup"
function toggleAuthMode(){
  authMode = authMode==="login" ? "signup" : "login";
  document.getElementById("loginTitle").textContent = authMode==="login" ? "Doctor / Operator Login" : "Create Your Account";
  document.getElementById("loginBtn").textContent = authMode==="login" ? "Login" : "Create Account";
  document.getElementById("modeLoginText").textContent = authMode==="login" ? "New here? " : "Already have an account? ";
  document.getElementById("modeToggle").textContent = authMode==="login" ? "Create Account" : "Login";
  document.getElementById("loginErr").textContent = "";
}

async function doLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPass").value;
  const errBox = document.getElementById("loginErr");
  errBox.textContent = "";
  if(!fb.ready){ errBox.textContent = "Firebase not connected."; return; }
  try{
    if(authMode==="login"){
      await fb.auth.signInWithEmailAndPassword(email, pass);
    } else {
      await fb.auth.createUserWithEmailAndPassword(email, pass);
    }
  }catch(e){
    errBox.textContent = (authMode==="login" ? "Login failed: " : "Sign up failed: ") + e.message;
  }
}
function doLogout(){ fb.auth.signOut(); }

// Each operator IS the doctor's account — doctorId is simply their Firebase Auth UID.
// This removes any need for an admin to manually link operators to doctors.
let myDoctorId = null;

async function createDoctorProfile(){
  const errBox = document.getElementById("profileErr");
  errBox.textContent = "";
  const name = document.getElementById("pfName").value.trim();
  const fee = Number(document.getElementById("pfFee").value);
  if(!name || !fee){ errBox.textContent = "Doctor name and consultation fee are required."; return; }

  // Sitewide default platform/service fee — developer can override per-doctor later directly in Firestore,
  // or change the default for future signups by editing config/fees.
  let defaults = { platformFee:100, serviceFee:20, avgConsultationMinutes:5 };
  try{
    const cfg = await fb.db.collection("config").doc("fees").get();
    if(cfg.exists) defaults = { ...defaults, ...cfg.data() };
  }catch(e){}

  const doctorData = {
    name, specialty: document.getElementById("pfSpecialty").value.trim(),
    qualifications: document.getElementById("pfQual").value.split(",").map(s=>s.trim()).filter(Boolean),
    experience: document.getElementById("pfExp").value.trim(),
    clinicName: document.getElementById("pfClinic").value.trim(),
    clinicAddress: document.getElementById("pfAddress").value.trim(),
    workingHours: document.getElementById("pfHours").value.trim(),
    consultationFee: fee,
    platformFee: defaults.platformFee,
    serviceFee: defaults.serviceFee,
    avgConsultationMinutes: defaults.avgConsultationMinutes,
    upiId: "", emergencyNumber: "To be configured by Admin",
    isActive: true
  };

  await fb.db.collection("doctors").doc(myDoctorId).set(doctorData);
  await fb.db.collection("queue").doc(myDoctorId).set({
    currentToken:0, status:"OPEN", lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("profileSetupScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
  listenAll();
}

if(fb.ready){
  fb.auth.onAuthStateChanged(async user=>{
    if(user){
      document.getElementById("loginScreen").classList.add("hidden");
      myDoctorId = user.uid;
      const doc = await fb.db.collection("doctors").doc(myDoctorId).get();
      if(!doc.exists){
        document.getElementById("profileSetupScreen").classList.remove("hidden");
      } else {
        document.getElementById("mainScreen").classList.remove("hidden");
        listenAll();
      }
    } else {
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("profileSetupScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.add("hidden");
    }
  });
}

let queueLive = {currentToken:0,status:"OPEN"};
let pending = [];   // appointments waiting_for_token
let active = [];    // appointments with a token, not yet completed

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function listenAll(){
  if(!fb.ready) return;

  // live queue doc
  fb.db.collection("queue").doc(myDoctorId).onSnapshot(doc=>{
    queueLive = doc.exists ? doc.data() : {currentToken:0,status:"OPEN"};
    render();
  });

  // ClinicQ online bookings waiting for a token — this is the operator's action queue
  fb.db.collection("appointments")
    .where("doctorId","==",myDoctorId)
    .where("status","==","waiting_for_token")
    .onSnapshot(snap=>{
      pending = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    });

  // Everyone currently in the live queue (token assigned, not completed/cancelled)
  fb.db.collection("appointments")
    .where("doctorId","==",myDoctorId)
    .where("status","in",["waiting","current"])
    .onSnapshot(snap=>{
      active = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.tokenNumber-b.tokenNumber);
      render();
    });
}

function nextTokenNumber(){
  const highestActive = active.reduce((m,a)=>Math.max(m,a.tokenNumber||0), 0);
  return Math.max(queueLive.currentToken+1, highestActive+1);
}

// CRITICAL: operator decides the token manually — never auto-assigned.
// This lets the operator account for offline walk-in patients already in the physical queue.
async function assignToken(appointmentId, patientName){
  if(!fb.ready) return;
  const suggested = nextTokenNumber();
  const input = prompt(`Enter token number for ${patientName}\n(Suggested next: ${suggested} — check your offline queue before confirming)`, suggested);
  if(input===null) return; // cancelled
  const token = parseInt(input, 10);
  if(!token || token<1){ alert("Enter a valid token number."); return; }
  await fb.db.collection("appointments").doc(appointmentId).update({
    tokenNumber: token,
    status: "waiting",
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function callNext(){
  if(!fb.ready){ alert("Connect Firebase first."); return; }
  const next = queueLive.currentToken + 1;
  await fb.db.collection("queue").doc(myDoctorId).set({
    currentToken: next, status:"OPEN", lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  }, {merge:true});
  // mark matching appointment(s) as current/completed
  active.forEach(async a=>{
    if(a.tokenNumber === next){
      await fb.db.collection("appointments").doc(a.id).update({status:"current", updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
    } else if(a.tokenNumber < next){
      await fb.db.collection("appointments").doc(a.id).update({status:"completed", updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
    }
  });
}

// Add a walk-in (offline) patient directly with a token — operator sets the number themselves
async function addWalkIn(){
  const name = document.getElementById("wiName").value.trim();
  const age = Number(document.getElementById("wiAge").value)||0;
  const mobile = document.getElementById("wiMobile").value.trim();
  const complaint = document.getElementById("wiComplaint").value.trim();
  const payType = document.getElementById("wiPayType").value;
  const suggested = nextTokenNumber();
  const input = prompt(`Enter token number for ${name||"this patient"}\n(Suggested next: ${suggested})`, suggested);
  if(input===null) return;
  const token = parseInt(input,10);
  if(!name || !token || token<1){ alert("Enter patient name and a valid token number."); return; }
  await fb.db.collection("appointments").add({
    userId:null, patientId:null, patientName:name, patientAge:age, patientMobile:mobile,
    complaint, doctorId:myDoctorId, paymentType:payType, amountPaid:0, paymentStatus:"verified",
    tokenNumber:token, status:"waiting", source:"walk_in",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  document.getElementById("wiName").value=""; document.getElementById("wiAge").value="";
  document.getElementById("wiMobile").value=""; document.getElementById("wiComplaint").value=""; document.getElementById("wiPayType").value="cash_at_clinic";
}

function render(){
  document.getElementById("app").innerHTML = `
  <div class="card">
    <div class="kpi"><span>Current Token</span><span class="bignum">#${queueLive.currentToken}</span></div>
    <div class="kpi"><span>Queue Status</span><span class="tag">${esc(queueLive.status)}</span></div>
  </div>

  <div class="card">
    <h3>Add Walk-in Patient</h3>
    <input id="wiName" placeholder="Patient name" style="margin-bottom:8px">
    <input id="wiAge" type="number" placeholder="Age" style="margin-bottom:8px">
    <input id="wiMobile" placeholder="Mobile number (so they can track token)" style="margin-bottom:8px">
    <input id="wiComplaint" placeholder="Complaint" style="margin-bottom:10px">
    <label style="font-size:13px;font-weight:750;display:block;margin-bottom:6px">Payment Type</label>
    <select id="wiPayType" style="width:100%;border:1px solid #ccd9e5;border-radius:12px;padding:12px;margin-bottom:10px">
      <option value="cash_at_clinic">Offline / Cash at Clinic</option>
      <option value="online">Already Paid Online</option>
    </select>
    <button class="primary" onclick="addWalkIn()">Add & Assign Token</button>
  </div>

  <div class="card">
    <h3>Online Booking Requests — Waiting for Token (${pending.length})</h3>
    <table><thead><tr><th>Patient</th><th>Age</th><th>Complaint</th><th>Payment</th><th></th></tr></thead><tbody>
    ${pending.map(p=>`<tr>
      <td>${esc(p.patientName)}</td><td>${p.patientAge}</td><td>${esc(p.complaint||"-")}</td>
      <td>${p.paymentType==="online"?"₹"+p.amountPaid+" Online":"₹"+p.amountPaid+" Service Fee (Cash consult)"}</td>
      <td><button class="primary" onclick="assignToken('${p.id}', '${esc(p.patientName)}')">Assign Token (suggested #${nextTokenNumber()})</button></td>
    </tr>`).join("") || `<tr><td colspan="5" class="small">No pending requests.</td></tr>`}
    </tbody></table>
  </div>

  <div class="card">
    <h3>Live Queue (${active.length})</h3>
    <table><thead><tr><th>Token</th><th>Patient</th><th>Complaint</th><th>Status</th></tr></thead><tbody>
    ${active.map(a=>`<tr>
      <td><b>#${a.tokenNumber}</b></td><td>${esc(a.patientName)}</td><td>${esc(a.complaint||"-")}</td>
      <td><span class="tag ${a.status==='current'?'':'warning'}">${esc(a.status)}</span></td>
    </tr>`).join("") || `<tr><td colspan="4" class="small">Queue empty.</td></tr>`}
    </tbody></table>
  </div>
  `;
}

render();
</script>
</body>
</html>
