<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicQ — Doctor's Panel</title>

<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;

  --teal:#0f766e;
  --teal-soft:#ecfdf5;

  --green:#15803d;
  --green-soft:#ecfdf3;

  --orange:#b45309;
  --orange-soft:#fff7ed;

  --red:#dc2626;
  --red-soft:#fef2f2;

  --text:#172033;
  --muted:#667085;
  --muted2:#98a2b3;

  --bg:#f6f7f9;
  --card:#ffffff;
  --line:#eaecf0;

  --shadow:0 2px 8px rgba(16,24,40,.05);
  --shadow-lg:0 10px 30px rgba(16,24,40,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:750;
  cursor:pointer;
  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease;
}

button:hover{
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.primary{
  background:var(--blue);
  color:#fff;
  box-shadow:0 5px 14px rgba(37,99,235,.22);
}

.primary:hover{
  background:var(--blue-dark);
}

.secondary{
  background:var(--blue-soft);
  color:var(--blue-dark);
}

.outline{
  background:#fff;
  color:var(--text);
  border:1px solid var(--line);
}

.outline:hover{
  background:#f9fafb;
}

.danger{
  background:var(--red-soft);
  color:var(--red);
}

.hidden{
  display:none!important;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:0 22px 80px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;

  min-height:72px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin:0 -22px 22px;
  padding:0 22px;

  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--line);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.6px;
}

.logo span{
  color:var(--blue);
}

.headerLeft{
  display:flex;
  align-items:center;
  gap:12px;
}

.doctorMini{
  display:flex;
  align-items:center;
  gap:9px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--blue-soft);
  color:var(--blue);
  font-weight:900;
}

.doctorMiniName{
  font-size:13px;
  font-weight:800;
}

.doctorMiniSub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.headerBtns{
  display:flex;
  align-items:center;
  gap:8px;
}

/* CONNECTION */

.connbar{
  background:#fff4ed;
  color:#9a3412;
  border:1px solid #fed7aa;
  text-align:center;
  font-size:12px;
  font-weight:700;
  padding:9px 12px;
  border-radius:10px;
  margin:14px 0;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin:14px 0;
  box-shadow:var(--shadow);
}

.card h3{
  margin:0;
  font-size:16px;
  letter-spacing:-.15px;
}

/* HERO */

.queueHero{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:18px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(59,130,246,.15),
      transparent 38%
    ),
    linear-gradient(
      135deg,
      #ffffff,
      #f8fbff
    );
}

.heroMain{
  padding:8px 4px;
}

.heroEyebrow{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.heroTitle{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
  margin:0;
}

.heroSub{
  color:var(--muted);
  margin:7px 0 20px;
  font-size:13px;
}

.currentTokenBox{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
}

.tokenLabel{
  color:var(--muted);
  font-size:11px;
  font-weight:750;
  letter-spacing:.5px;
}

.bignum{
  font-size:60px;
  line-height:1;
  font-weight:950;
  letter-spacing:-3px;
  color:var(--blue);
}

.nextBtn{
  min-width:155px;
}

.queueSide{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
  padding:8px;
}

.queueSideBox{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 15px;
}

.queueSideLabel{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.queueSideValue{
  font-size:17px;
  font-weight:850;
  margin-top:4px;
}

/* LIVE */

.liveBadge{
  display:inline-flex;
  align-items:center;
  gap:7px;

  font-size:11px;
  font-weight:850;

  color:#15803d;
  background:var(--green-soft);

  padding:6px 10px;
  border-radius:999px;
}

.liveDot{
  position:relative;
  width:8px;
  height:8px;
  background:#22c55e;
  border-radius:50%;
}

.liveDot:before{
  content:"";
  position:absolute;
  inset:0;
  background:#22c55e;
  border-radius:50%;

  animation:
    livePing 1.6s cubic-bezier(0,0,.2,1) infinite;
}

@keyframes livePing{
  0%{
    transform:scale(1);
    opacity:.7;
  }

  75%,100%{
    transform:scale(3.2);
    opacity:0;
  }
}

/* KPI */

.kpiGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:14px 0;
}

.kpiCard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:var(--shadow);
}

.kpiTop{
  display:flex;
  justify-content:space-between;
  align-items:center;

  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.kpiValue{
  font-size:26px;
  font-weight:900;
  margin-top:7px;
}

.kpiIcon{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:var(--blue-soft);
}

/* SECTION */

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  margin-bottom:15px;
}

.sectionHeadLeft{
  display:flex;
  align-items:center;
  gap:9px;
}

.countBadge{
  min-width:25px;
  height:25px;

  display:inline-grid;
  place-items:center;

  padding:0 8px;

  border-radius:999px;

  background:var(--blue-soft);
  color:var(--blue-dark);

  font-size:11px;
  font-weight:850;
}

/* FORM */

.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.formGrid .full{
  grid-column:1/-1;
}

.formLabel{
  display:block;
  font-size:12px;
  font-weight:750;
  color:#344054;
  margin:2px 0 6px;
}

input,
select{
  width:100%;

  border:1px solid #d0d5dd;
  border-radius:10px;

  padding:11px 12px;

  outline:none;

  background:#fff;
  color:var(--text);

  transition:
    border-color .15s,
    box-shadow .15s;
}

input::placeholder{
  color:#98a2b3;
}

input:focus,
select:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.10);
}

.formBottom{
  grid-column:1/-1;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-top:2px;
}

/* PATIENT CARDS */

.patientList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.patientCard{
  display:grid;
  grid-template-columns:1fr auto;
  gap:15px;
  align-items:center;

  padding:15px;

  border:1px solid var(--line);
  border-radius:13px;

  transition:
    box-shadow .15s,
    border-color .15s;
}

.patientCard:hover{
  border-color:#d7e2f0;
  box-shadow:0 4px 16px rgba(16,24,40,.06);
}

.patientName{
  font-size:14px;
  font-weight:850;
  margin-bottom:5px;
}

.patientMeta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;

  color:var(--muted);
  font-size:12px;
}

.patientComplaint{
  color:#475467;
  font-size:12px;
  margin-top:8px;
}

.patientAction{
  text-align:right;
}

/* TAGS */

.tag{
  display:inline-flex;
  align-items:center;

  padding:5px 9px;

  border-radius:999px;

  font-size:10px;
  font-weight:800;

  background:var(--green-soft);
  color:var(--green);
}

.blueTag{
  background:var(--blue-soft);
  color:var(--blue-dark);
}

.warning{
  background:var(--orange-soft);
  color:var(--orange);
}

.redTag{
  background:var(--red-soft);
  color:var(--red);
}

/* QUEUE */

.queueList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.queueRow{
  display:grid;
  grid-template-columns:70px 1fr auto auto;
  align-items:center;
  gap:14px;

  padding:12px 13px;

  border:1px solid var(--line);
  border-radius:12px;
}

.queueRow.current{
  background:var(--blue-soft);
  border-color:#bfdbfe;
}

.queueToken{
  font-size:16px;
  font-weight:900;
  color:var(--blue);
}

.queuePatient{
  font-size:13px;
  font-weight:800;
}

.queuePatient small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-weight:500;
}

.paymentText{
  font-size:12px;
  color:var(--muted);
}

/* SEARCH */

.searchRow{
  display:flex;
  gap:8px;
}

.searchRow input{
  flex:1;
}

/* REFUND */

.refundList{
  margin-top:15px;
}

.refundRow{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:12px;
  align-items:center;

  padding:12px 0;

  border-bottom:1px solid var(--line);
}

.refundRow:last-child{
  border-bottom:0;
}

.refundName{
  font-size:13px;
  font-weight:800;
}

/* EMPTY */

.emptyState{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
}

.emptyIcon{
  font-size:29px;
  margin-bottom:8px;
}

.small{
  color:var(--muted);
  font-size:12px;
}

/* LOGIN */

.loginWrap{
  max-width:390px;
  margin:80px auto;

  background:#fff;

  border:1px solid var(--line);
  border-radius:18px;

  padding:28px;

  box-shadow:var(--shadow-lg);
}

.loginWrap label{
  display:block;

  font-size:12px;
  font-weight:750;

  margin:13px 0 6px;

  color:#344054;
}

.loginWrap input{
  width:100%;
}

.loginErr{
  color:var(--red);
  font-size:12px;
  margin-top:10px;
}

/* PROFILE */

.profileIntro{
  text-align:center;
  margin-bottom:20px;
}

.profileIntro .logo{
  margin-bottom:8px;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.profileGrid .full{
  grid-column:1/-1;
}

.profileGrid label{
  display:block;
  font-size:12px;
  font-weight:750;
  margin-bottom:6px;
}

/* MODAL */

.modalOverlay{
  position:fixed;
  inset:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(15,23,42,.55);

  backdrop-filter:blur(5px);
}

.modal{
  width:100%;
  max-width:430px;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 25px 70px rgba(15,23,42,.25);

  overflow:hidden;

  animation:modalIn .18s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.98);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:18px 20px;

  border-bottom:1px solid var(--line);
}

.modalTitle{
  font-size:17px;
  font-weight:900;
}

.closeBtn{
  width:34px;
  height:34px;

  padding:0;

  display:grid;
  place-items:center;

  background:#f2f4f7;
  color:#475467;
}

.modalBody{
  padding:20px;
}

.modalPatient{
  background:var(--blue-soft);
  border:1px solid #dbeafe;

  border-radius:13px;

  padding:14px;

  margin-bottom:15px;
}

.modalPatientName{
  font-weight:850;
}

.modalPatientMeta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.suggestedToken{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:10px 0;

  padding:12px 14px;

  border-radius:12px;

  background:#f8fafc;

  border:1px solid var(--line);
}

.suggestedToken b{
  color:var(--blue);
  font-size:18px;
}

.modalFooter{
  display:flex;
  gap:8px;

  padding:15px 20px;

  border-top:1px solid var(--line);
}

.modalFooter button{
  flex:1;
}

/* MOBILE STICKY ACTION */

.mobileAction{
  display:none;
}

@media(max-width:760px){

  .wrap{
    padding:0 13px 95px;
  }

  header{
    margin:0 -13px 14px;
    padding:0 13px;

    min-height:62px;
  }

  .logo{
    font-size:21px;
  }

  .doctorMini{
    display:none;
  }

  .headerBtns .outline{
    display:none;
  }

  .headerBtns .primary{
    padding:10px 13px;
    font-size:12px;
  }

  .queueHero{
    grid-template-columns:1fr;
  }

  .heroTitle{
    font-size:25px;
  }

  .bignum{
    font-size:48px;
  }

  .currentTokenBox{
    align-items:center;
  }

  .nextBtn{
    min-width:auto;
  }

  .queueSide{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .kpiGrid{
    grid-template-columns:repeat(3,1fr);
    gap:7px;
  }

  .kpiCard{
    padding:12px 10px;
  }

  .kpiValue{
    font-size:21px;
  }

  .kpiIcon{
    display:none;
  }

  .formGrid,
  .profileGrid{
    grid-template-columns:1fr;
  }

  .formGrid .full,
  .profileGrid .full{
    grid-column:auto;
  }

  .formBottom{
    grid-column:auto;

    flex-direction:column;
    align-items:stretch;
  }

  .formBottom button{
    width:100%;
  }

  .patientCard{
    grid-template-columns:1fr;
  }

  .patientAction{
    text-align:left;
  }

  .patientAction button{
    width:100%;
  }

  .queueRow{
    grid-template-columns:55px 1fr auto;
    gap:9px;
  }

  .queueRow .paymentText{
    display:none;
  }

  .searchRow{
    flex-direction:column;
  }

  .searchRow button{
    width:100%;
  }

  .refundRow{
    grid-template-columns:1fr auto;
  }

  .refundRow > div:nth-child(2){
    grid-column:1/-1;
  }

  .mobileAction{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    z-index:80;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:10px 13px;

    background:rgba(255,255,255,.96);

    border-top:1px solid var(--line);

    backdrop-filter:blur(15px);
  }

  .mobileCurrent{
    font-size:12px;
    color:var(--muted);
  }

  .mobileCurrent b{
    display:block;
    color:var(--text);
    font-size:15px;
  }

  .mobileAction button{
    flex:1;
    max-width:210px;
  }

}

@media(min-width:761px){
  #app{
    padding-bottom:20px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div
    id="connbar"
    class="connbar hidden"
  >
    ⚠ Firebase not configured yet.
  </div>


  <!-- LOGIN -->

  <div
    id="loginScreen"
    class="loginWrap"
  >

    <div
      class="logo"
      style="text-align:center"
    >
      Clinic<span>Q</span>
    </div>

    <p
      id="loginTitle"
      style="
        text-align:center;
        color:var(--muted);
        margin-top:7px
      "
    >
      Doctor / Operator Login
    </p>

    <label>Email</label>

    <input
      id="loginEmail"
      type="email"
      placeholder="doctor@example.com"
    >

    <label>Password</label>

    <input
      id="loginPass"
      type="password"
      placeholder="••••••••"
    >

    <button
      id="loginBtn"
      class="primary"
      style="
        width:100%;
        margin-top:16px
      "
      onclick="doLogin()"
    >
      Login
    </button>

    <div
      id="loginErr"
      class="loginErr"
    ></div>

    <p
      style="
        text-align:center;
        margin-top:14px;
        font-size:13px
      "
    >
      <span id="modeLoginText">
        New here?
      </span>

      <a
        href="#"
        id="modeToggle"
        onclick="
          toggleAuthMode();
          return false;
        "
        style="
          color:var(--blue);
          font-weight:750;
        "
      >
        Create Account
      </a>
    </p>

  </div>


  <!-- PROFILE -->

  <div
    id="profileSetupScreen"
    class="loginWrap hidden"
    style="max-width:520px"
  >

    <div class="profileIntro">

      <div class="logo">
        Clinic<span>Q</span>
      </div>

      <div
        style="
          color:var(--muted);
          font-size:13px
        "
      >
        Set up your Doctor Profile
      </div>

    </div>


    <div class="profileGrid">

      <div class="full">
        <label>Doctor Name</label>
        <input
          id="pfName"
          placeholder="Dr. Full Name"
        >
      </div>

      <div>
        <label>Specialty</label>
        <input
          id="pfSpecialty"
          placeholder="e.g. Cardiologist"
        >
      </div>

      <div>
        <label>Experience</label>
        <input
          id="pfExp"
          placeholder="e.g. 10 Years"
        >
      </div>

      <div class="full">
        <label>Qualifications</label>
        <input
          id="pfQual"
          placeholder="MBBS, MD"
        >
      </div>

      <div class="full">
        <label>Clinic Name</label>
        <input
          id="pfClinic"
          placeholder="Clinic name"
        >
      </div>

      <div class="full">
        <label>Clinic Address</label>
        <input
          id="pfAddress"
          placeholder="Clinic address"
        >
      </div>

      <div>
        <label>Working Hours</label>
        <input
          id="pfHours"
          placeholder="10 AM – 2 PM"
        >
      </div>

      <div>
        <label>Consultation Fee (₹)</label>
        <input
          id="pfFee"
          type="number"
          placeholder="500"
        >
      </div>

    </div>

    <p class="small" style="margin:14px 0">
      Platform and service fees are configured automatically.
    </p>

    <button
      class="primary"
      style="width:100%"
      onclick="createDoctorProfile()"
    >
      Create Profile & Start →
    </button>

    <div
      id="profileErr"
      class="loginErr"
    ></div>

  </div>


  <!-- MAIN -->

  <div
    id="mainScreen"
    class="hidden"
  >

    <header>

      <div class="headerLeft">

        <div class="logo">
          Clinic<span>Q</span>
        </div>

        <div class="doctorMini">

          <div
            id="doctorAvatar"
            class="avatar"
          >
            Dr
          </div>

          <div>
            <div
              id="doctorMiniName"
              class="doctorMiniName"
            >
              Doctor
            </div>

            <div
              id="doctorMiniSub"
              class="doctorMiniSub"
            >
              Operator Panel
            </div>
          </div>

        </div>

      </div>


      <div class="headerBtns">

        <button
          class="primary"

        .getElementById("pfClinic")

/* =========================================================
   FIRESTORE LISTENERS
========================================================= */

function listenAll(){

  if(!fb.ready || !myDoctorId){
    return;
  }


  /* Queue */

  fb.db
    .collection("queue")
    .doc(myDoctorId)
    .onSnapshot(doc => {

      queueLive =
        doc.exists
          ? doc.data()
          : {
              currentToken:0,
              status:"OPEN"
            };


      updateMobileAction();

      render();

    });


  /* Pending online bookings */

  fb.db
    .collection("appointments")
    .where(
      "doctorId",
      "==",
      myDoctorId
    )
    .where(
      "status",
      "==",
      "waiting_for_token"
    )
    .onSnapshot(snap => {

      pending =
        snap.docs.map(
          d => ({
            id:d.id,
            ...d.data()
          })
        );


      render();

    });


  /* Active queue */

  fb.db
    .collection("appointments")
    .where(
      "doctorId",
      "==",
      myDoctorId
    )
    .where(
      "status",
      "in",
      [
        "waiting",
        "current"
      ]
    )
    .onSnapshot(snap => {

      active =
        snap.docs
          .map(
            d => ({
              id:d.id,
              ...d.data()
            })
          )
          .sort(
            (a,b) =>
              (a.tokenNumber || 0) -
              (b.tokenNumber || 0)
          );


      render();

    });

}


/* =========================================================
   HELPERS
========================================================= */

function esc(x){

  return String(x ?? "")
    .replace(
      /[&<>"']/g,
      m =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "\"":"&quot;",
          "'":"&#39;"
        }[m])
    );

}


function nextTokenNumber(){

  const highestActive =
    active.reduce(
      (m,a) =>
        Math.max(
          m,
          Number(a.tokenNumber) || 0
        ),
      0
    );


  return Math.max(
    Number(queueLive.currentToken || 0) + 1,
    highestActive + 1
  );

}

   TOKEN MODAL

function openTokenModal(
  appointmentId,
  patientName,

){

  tokenAppointmentId =

  const suggested =
    nextTokenNumber();


  document

    .textContent =
      "#" + suggested;


  document

      suggested;

  setTimeout(

function closeTokenModal(event){

  if(
    event &&
    event.target !== event.currentTarget
  ){

    return;

  }


  tokenAppointmentId = null;


  document
    .getElementById("tokenModal")
    .classList
    .add("hidden");

}


async function confirmTokenAssignment(){

  if(!tokenAppointmentId){
    return;
  }


  const input =
    document
      .getElementById("modalTokenInput")
      .value;


  const token =
    parseInt(input,10);


  const error =
    document
      .getElementById("modalTokenError");


  error.textContent = "";


  if(!token || token < 1){

    error.textContent =
      "Please enter a valid token number.";

    return;

  }


  const duplicate =
    active.some(
      a =>
        Number(a.tokenNumber) === token
    );


  if(duplicate){

    error.textContent =
      `Token #${token} is already in the live queue.`;

    return;

  }


  try{

    await fb.db
      .collection("appointments")
      .doc(tokenAppointmentId)
      .update({

        tokenNumber:token,

        status:"waiting",

        updatedAt:
          firebase.firestore.FieldValue
            .serverTimestamp()

      });


    closeTokenModal();

  }catch(e){

    console.error(e);

    error.textContent =
      "Could not assign token: " +
      e.message;

  }

}


/* =========================================================
   CALL NEXT
========================================================= */

async function callNext(){

  if(!fb.ready){

    alert(
      "Connect Firebase first."
    );

    return;

  }


  const next =
    Number(queueLive.currentToken || 0) + 1;


  try{

    await fb.db
      .collection("queue")
      .doc(myDoctorId)
      .set({

        currentToken:next,

        status:"OPEN",

        lastUpdated:
          firebase.firestore.FieldValue
            .serverTimestamp()

      },{
        merge:true
      });


    const updates =
      [];


    active.forEach(a => {

      if(
        Number(a.tokenNumber) === next
      ){

        updates.push(
          fb.db
            .collection("appointments")
            .doc(a.id)
            .update({

              status:"current",

              updatedAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()

            })
        );

      }else if(
        Number(a.tokenNumber) < next
      ){

        updates.push(
          fb.db
            .collection("appointments")
            .doc(a.id)
            .update({

              status:"completed",

              updatedAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()

            })
        );

      }

    });


    await Promise.all(updates);


  }catch(e){

    console.error(e);

    alert(
      "Unable to call next token: " +
      e.message
    );

  }

}

/*
  Simple fallback modal-style prompt for walk-ins.
  Online appointments use the proper token modal above.
*/

function askWalkInToken(
  name,
  suggested
){

  return new Promise(resolve => {

    const token =
      window.prompt(
        `Token number for ${name}\n\nSuggested: ${suggested}`,
        suggested
      );


    if(token === null){

      resolve(null);

      return;

    }


    const parsed =
      parseInt(token,10);


    if(
      !parsed ||
      parsed < 1
    ){

      alert(
        "Enter a valid token number."
      );

      resolve(null);

      return;

    }


    const duplicate =
      active.some(
        a =>
          Number(a.tokenNumber) === parsed
      );


    if(duplicate){

      alert(
        `Token #${parsed} is already in use.`
      );

      resolve(null);

      return;

    }


    resolve(parsed);

  });

}

  if(!q){

    render();

  try{

    const snap =
      await fb.db
        .collection("appointments")
        .where(
          "doctorId",
          "==",
          myDoctorId
        )
        .get();


    refundResults =
      snap.docs
        .map(
          d => ({
            id:d.id,
            ...d.data()
          })
        )
        .filter(a => {

          return (

            (a.patientName || "")
              .toLowerCase()
              .includes(q)

            ||

            (a.patientMobile || "")
              .includes(q)

          );

        });


    render();


  }catch(e){

    console.error(e);

    alert(
      "Could not search patients: " +
      e.message
    );

  }

  id,

  amountPaid
){

  const input =
    prompt(
      `Refund amount for ${patientName}\n\nAmount paid: ₹${amountPaid}`,
      amountPaid
    );


  if(input === null){
    return;
  }


  const amt =
    Number(input);


  if(
    !amt ||
    amt <= 0
  ){

    alert(
      "Enter a valid refund amount."
    );

    return;

  }


  try{

    await fb.db
      .collection("appointments")
      .doc(id)
      .update({

        refunded:true,

        refundAmount:amt,

        refundedAt:
          firebase.firestore.FieldValue
            .serverTimestamp(),

    }


    render();


  }catch(e){

    alert(
      "Refund failed: " +

    );

  }

          <span class="kpiIcon">
            🩺
          </span>

        </div>

        <div class="kpiValue">
          #${queueLive.currentToken || 0}
        </div>

      </div>


      <div class="kpiCard">

        <div class="kpiTop">

          Requests

          <span class="kpiIcon">
            📋
          </span>

        </div>

        <div class="kpiValue">
          ${pending.length}
        </div>

      </div>

    </div>


    <!-- WALK-IN -->

    <div class="card">

      <div class="sectionHead">

        <div class="sectionHeadLeft">

          <h3>
            ➕ Add Walk-in Patient
          </h3>

          <span class="tag warning">
            OFFLINE
          </span>

        </div>

      </div>


      <div class="formGrid">

        <div>

          <label class="formLabel">
            Patient Name
          </label>

          <input
            id="wiName"
            placeholder="Enter patient name"
          >

        </div>


        <div>

          <label class="formLabel">
            Age
          </label>

          <input
            id="wiAge"
            type="number"
            placeholder="Age"
          >

        </div>


        <div>

          <label class="formLabel">
            Mobile Number
          </label>

          <input
            id="wiMobile"
            placeholder="10-digit mobile number"
          >

        </div>


        <div>

          <label class="formLabel">
            Payment Method
          </label>

          <select id="wiMethod">

            <option value="cash">
              Cash
            </option>

            <option value="upi">
              UPI
            </option>

          </select>

        </div>


        <div class="full">

          <label class="formLabel">
            Complaint / Reason for Visit
          </label>

          <input
            id="wiComplaint"
            placeholder="e.g. Fever, headache, follow-up..."
          >

        </div>


        <div>

          <label class="formLabel">
            Amount Paid
          </label>

          <input
            id="wiAmount"
            type="number"
            placeholder="₹ Amount"
          >

        </div>


        <div class="formBottom">

          <span class="small">
            Suggested token:
            <b>
              #${nextTokenNumber()}
            </b>
          </span>

          <button
            class="primary"
            onclick="addWalkIn()"
          >
            Add Patient →
          </button>

        </div>

      </div>

    </div>


    <!-- ONLINE REQUESTS -->

    <div class="card">

      <div class="sectionHead">

        <div class="sectionHeadLeft">

          <h3>
            Online Booking Requests
          </h3>

          <span class="countBadge">
            ${pending.length}
          </span>

        </div>

      </div>


      ${
        pending.length

        ?

        `
        <div class="patientList">

          ${pending.map(p => `

            <div class="patientCard">

              <div>

                <div class="patientName">
                  ${esc(p.patientName)}
                </div>


                <div class="patientMeta">

                  <span>
                    ${
                      p.patientAge
                        ? p.patientAge + " yrs"
                        : "Age N/A"
                    }
                  </span>

                  <span>•</span>

                  <span class="tag blueTag">
                    ONLINE
                  </span>

                  <span>•</span>

                  <span>
                    ₹${p.amountPaid || 0}
                  </span>

                </div>


                <div class="patientComplaint">

                  ${
                    p.complaint
                      ? esc(p.complaint)
                      : "No complaint provided"
                  }

                </div>

              </div>


              <div class="patientAction">

                <button
                  class="primary"
                  onclick="
                    openTokenModal(
                      '${p.id}',
                      '${esc(p.patientName)}',
                      '${p.patientAge || ""}'
                    )
                  "
                >
                  Assign #${nextTokenNumber()}
                </button>

              </div>

            </div>

          `).join("")}

        </div>
        `

        :

        `
        <div class="emptyState">

          <div class="emptyIcon">
            📋
          </div>

          <div>
            No online booking requests
          </div>

          <div class="small">
            New bookings will appear here automatically.
          </div>

        </div>
        `
      }

    </div>


    <!-- LIVE QUEUE -->

    <div class="card">

      <div class="sectionHead">

        <div class="sectionHeadLeft">

          <h3>
            Live Queue
          </h3>

          <span class="countBadge">
            ${active.length}
          </span>

        </div>


        <span class="liveBadge">

          <span class="liveDot"></span>

          LIVE

        </span>

      </div>


      ${
        active.length

        ?

        `
        <div class="queueList">

          ${active.map(a => `

            <div
              class="queueRow ${
                a.status === "current"
                  ? "current"
                  : ""
              }"
            >

              <div class="queueToken">
                #${a.tokenNumber}
              </div>


              <div>

                <div class="queuePatient">

                  ${esc(a.patientName)}

                  ${
                    a.status === "current"
                      ? `
                        <span
                          class="tag"
                          style="margin-left:5px"
                        >
                          NOW
                        </span>
                      `
                      : ""
                  }

                </div>


                <small>

                  ${
                    a.patientAge
                      ? a.patientAge + " years"
                      : "Age not provided"
                  }

                </small>

              </div>


              <div>

                <span
                  class="tag ${
                    a.source === "walk_in"
                      ? "warning"
                      : "blueTag"
                  }"
                >

                  ${
                    a.source === "walk_in"
                      ? "WALK-IN"
                      : "ONLINE"
                  }

                </span>

              </div>


              <div class="paymentText">

                ${
                  a.refunded

                    ?

                    `
                    <span class="tag redTag">
                      Refunded ₹${a.refundAmount}
                    </span>
                    `

                    :

                    a.amountPaid

                    ?

                    `
                    ₹${a.amountPaid}

                    ${
                      a.paymentMethod
                        ? `
                          (${esc(
                            a.paymentMethod
                              .toUpperCase()
                          )})
                        `
                        : ""
                    }
                    `

                    :

                    "-"
                }

              </div>

            </div>

          `).join("")}

        </div>
        `

        :

        `
        <div class="emptyState">

          <div class="emptyIcon">
            🎫
          </div>

          <div>
            Queue is empty
          </div>

          <div class="small">
            Add a walk-in or assign a token to an online booking.
          </div>

        </div>
        `
      }

    </div>


    <!-- REFUND -->

    <div class="card">

      <div class="sectionHead">

        <h3>
          💰 Refund Patient
        </h3>

      </div>


      <p class="small">
        Search a patient by name or mobile number.
      </p>


      <div class="searchRow">

        <input
          id="refundQuery"
          placeholder="Search patient..."
          onkeydown="
            if(event.key === 'Enter')
              searchRefundPatient()
          "
        >


        <button
          class="outline"
          onclick="searchRefundPatient()"
        >
          Search
        </button>

      </div>


      ${
        refundResults.length

        ?

        `
        <div class="refundList">

          ${refundResults.map(a => `

            <div class="refundRow">

              <div>

                <div class="refundName">
                  ${esc(a.patientName)}
                </div>

                <div class="small">

                  ${
                    a.patientMobile
                      ? esc(a.patientMobile)
                      : "No mobile"
                  }

                  ${
                    a.tokenNumber
                      ? ` • Token #${a.tokenNumber}`
                      : ""
                  }

                </div>

              </div>


              <div>
                ₹${a.amountPaid || 0}
              </div>


              <div>

                ${
                  a.refunded

                    ?

                    `
                    <span class="tag redTag">
                      Refunded ₹${a.refundAmount}
                    </span>
                    `

                    :

                    a.amountPaid > 0

                    ?

                    `
                    <button
                      class="danger"
                      onclick="
                        refundPatient(
                          '${a.id}',
                          '${esc(a.patientName)}',
                          ${a.amountPaid}
                        )
                      "
                    >
                      Refund
                    </button>
                    `

                    :

                    `
                    <span class="small">
                      No payment
                    </span>
                    `
                }

              </div>

            </div>

          `).join("")}

        </div>
        `

        :

        ""
      }

    </div>

  `;


  updateMobileAction();

}


/* =========================================================
   INITIAL
========================================================= */

render();

</script>

</body>
                              </html>
