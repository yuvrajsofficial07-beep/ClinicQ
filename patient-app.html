<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClinicQ — Patient App</title>
<style>
:root{--blue:#1769ff;--blue2:#3b82f6;--dark:#17324d;--muted:#64788a;--bg:#eef4fb;--line:#e2eaf2;--green:#18864b;--orange:#9a6500;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px 16px;font-weight:750;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 16px #1769ff33}.secondary{background:#e9f1ff;color:#1258c4}.outline{background:#fff;border:1px solid var(--line);color:var(--dark)}.danger{background:#ffe9e7;color:var(--red)}
.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 35px #17324d12}
header{height:68px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
.logo{font-size:24px;font-weight:900;letter-spacing:-.3px}.logo span{color:var(--blue)}.screen{padding:22px 20px 105px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 20px #17324d0d}
h1{font-size:28px;line-height:1.15;margin:7px 0 10px}h2{font-size:20px;margin:5px 0 12px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:7px 0}.small{font-size:12px;color:var(--muted)}.center{text-align:center}
label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #ccd9e5;border-radius:12px;padding:13px;background:#fff;outline:none;transition:border-color .15s}input:focus,select:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:85px}
.row{display:flex;gap:10px}.row>*{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:750;background:#eaf7ef;color:var(--green)}.warning{background:#fff4d5;color:var(--orange)}.dangerTag{background:#ffe9e7;color:var(--red)}
.kpi{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eef2f5}.kpi:last-child{border-bottom:0}.kpi b{font-size:18px}
.token{font-size:72px;line-height:1;font-weight:950;background:linear-gradient(135deg,var(--blue),var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:8px 0}.tokenLabel{text-align:center;color:var(--muted);font-size:13px}
.avatar{width:56px;height:56px;border-radius:50%;background:#eaf1ff;color:var(--blue);display:grid;place-items:center;font-size:22px;font-weight:900;flex:none}
.avatarG{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--blue),#60a5fa);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none;letter-spacing:.5px}
.doctor{display:flex;gap:14px;align-items:flex-start}
.card.doctor{transition:box-shadow .15s,transform .15s}.card.doctor:active{transform:scale(.985)}
.big{width:100%;margin-top:10px}.muted{background:#f7fafc}.success{padding:13px;border-radius:12px;background:#e9f8ef;color:#176b38}.alert{padding:13px;border-radius:12px;background:#fff4d5;color:#765600}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:20;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px #17324d0d}
.nav button{background:none;border:none;color:#96a7b8;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 14px;border-radius:14px;font-size:10.5px;font-weight:750;transition:background .15s,color .15s}
.nav button.active{color:var(--blue);background:#eaf1ff}
.nav .navDot{position:absolute;top:4px;right:16px;width:8px;height:8px;background:#e0433d;border-radius:50%;border:2px solid #fff}
.splash{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.splash .logo{font-size:42px}.splash p{max-width:400px;margin:10px auto}
.hidden{display:none!important}.back{background:none;padding:0;color:var(--blue);font-weight:750;margin-bottom:14px}
.connbar{position:fixed;top:0;left:0;right:0;background:#b42318;color:#fff;text-align:center;font-size:12px;padding:6px;z-index:999}
@media(min-width:700px){.app{min-height:100vh}.screen{padding-left:28px;padding-right:28px}}

/* Live pulsing indicator */
.liveBadge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:#127a3f;background:#e8f9ef;padding:5px 11px;border-radius:999px;letter-spacing:.3px}
.liveDot{position:relative;width:8px;height:8px;background:#1db954;border-radius:50%;flex:none}
.liveDot::before{content:'';position:absolute;top:0;left:0;width:8px;height:8px;background:#1db954;border-radius:50%;animation:livePing 1.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes livePing{0%{transform:scale(1);opacity:.7}75%,100%{transform:scale(3.4);opacity:0}}

/* TV Mode — large clinic monitor display */
.tv{min-height:100vh;background:#0b1c2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:Inter,system-ui,sans-serif}
.tv .logo{font-size:32px;font-weight:900;margin-bottom:6px}.tv .logo span{color:#3b82f6}
.tv .clinicName{color:#93a9c2;font-size:18px;margin-bottom:40px}
.tv .nowLabel{color:#93a9c2;font-size:22px;letter-spacing:3px;font-weight:700}
.tv .nowNum{font-size:220px;font-weight:950;line-height:1;background:linear-gradient(135deg,#3b82f6,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 40px}
.tv .nextRow{display:flex;gap:60px;justify-content:center;margin-top:10px}
.tv .nextBox{background:#132840;border-radius:20px;padding:20px 40px}
.tv .nextLabel{color:#93a9c2;font-size:14px;letter-spacing:2px}
.tv .nextNum{font-size:56px;font-weight:900;color:#fff}
.tv .tvFooter{margin-top:50px;color:#7691ac;font-size:16px}
@media(max-width:700px){.tv .nowNum{font-size:120px}.tv .nextNum{font-size:36px}}

/* ===== ClinicQ Live Experience ===== */
.liveCard{position:relative;overflow:hidden}.liveCard::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.42) 48%,transparent 72%);transform:translateX(-120%);animation:cardShimmer 3.2s ease-in-out infinite;pointer-events:none}@keyframes cardShimmer{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.pulseRing{position:relative}.pulseRing::after{content:"";position:absolute;inset:-4px;border:2px solid #3b82f6;border-radius:inherit;opacity:0;animation:ringPulse 1.8s ease-out infinite;pointer-events:none}@keyframes ringPulse{0%{transform:scale(.96);opacity:.55}100%{transform:scale(1.06);opacity:0}}
.tokenPop{animation:tokenPop .55s cubic-bezier(.2,.8,.2,1)}@keyframes tokenPop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.slideUp{animation:slideUp .45s ease both}@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.doctorOnline{display:inline-flex;align-items:center;gap:6px;color:#127a3f;font-size:11px;font-weight:800}.doctorOnline i{width:7px;height:7px;border-radius:50%;background:#1db954;box-shadow:0 0 0 4px #1db95422;animation:onlinePulse 1.6s infinite}@keyframes onlinePulse{50%{box-shadow:0 0 0 7px #1db95400}}
.progressTrack{height:8px;background:#edf2f7;border-radius:999px;overflow:hidden;margin:8px 0}.progressBar{height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa);border-radius:999px;transition:width .7s ease}
.nextSlot{border:1px solid #dce8f7;background:linear-gradient(135deg,#f7fbff,#eef5ff);border-radius:15px;padding:13px}.statusHero{background:linear-gradient(135deg,#1769ff,#4f8dfd);color:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 25px #1769ff26;position:relative;overflow:hidden}.statusHero::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-80px;background:#ffffff18}.statusHero p,.statusHero .small{color:#eaf2ff}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>

<!-- Firebase SDK (compat build — works with plain <script> tags, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<script>
/* =========================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (from Firebase console)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDsk5VfH0d2UWa_60E_UxQbCCRLDzFsiGA",
  authDomain: "clinic-a4513.firebaseapp.com",
  projectId: "clinic-a4513",
  storageBucket: "clinic-a4513.firebasestorage.app",
  messagingSenderId: "949075919558",
  appId: "1:949075919558:web:aad21915e2cea6e5588dc7",
  measurementId: "G-JZV455CNCV"
};

let fb = { ready:false };
try{
  if(firebaseConfig.apiKey!=="REPLACE_ME"){
    firebase.initializeApp(firebaseConfig);
    fb.db = firebase.firestore();
    fb.auth = firebase.auth();
    fb.ready = true;
  } else {
    document.getElementById("connbar").classList.remove("hidden");
  }
}catch(e){ console.error("Firebase init failed:", e); document.getElementById("connbar").classList.remove("hidden"); }

/* =========================================================
   2) LOCAL UI STATE (screen navigation only — NOT app data)
   ========================================================= */
let selectedDoctorId = null; // set when the patient picks a doctor from the list
let S = {
  screen:"splash", lang:"en",
  demoUserId: localStorage.getItem("clinicq_demo_uid") || null, // stand-in for real Auth UID until phone auth is wired (needs hosted domain)
  patients:[], selectedPatientId:null,
  doctor:null, doctorsList:[], queueLive:null,
  appointment:null,
  unsubQueue:null, unsubAppointment:null
};
if(!S.demoUserId){ S.demoUserId = "demo_"+Math.random().toString(36).slice(2,10); localStorage.setItem("clinicq_demo_uid", S.demoUserId); }

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function setScreen(x){ S.screen=x; render(); }
function selectedPatient(){ return S.patients.find(p=>p.id===S.selectedPatientId) || null; }
function waitMinutes(token){ if(!S.queueLive) return null; return Math.max(0,(token-S.queueLive.currentToken))*(S.doctor?.avgConsultationMinutes||5); }

/* =========================================================
   3) FIRESTORE DATA FUNCTIONS
   ========================================================= */

// Load doctor doc once (fee/hours/etc rarely change)
async function loadDoctor(){
  if(!fb.ready || !selectedDoctorId) return;
  const doc = await fb.db.collection("doctors").doc(selectedDoctorId).get();
  S.doctor = doc.exists ? doc.data() : null;
}

function timeToMinutes(v){ if(!v)return null; const m=String(v).match(/(\d{1,2}):(\d{2})/); if(!m)return null; let h=+m[1],n=+m[2]; if(/pm/i.test(v)&&h<12)h+=12; if(/am/i.test(v)&&h===12)h=0; return h*60+n; }
function doctorSchedule(){ const d=S.doctor||{}; let start=d.consultationStart||"",end=d.consultationEnd||""; if(!start&&d.workingHours){const x=String(d.workingHours).split(/\s*(?:-|–|to)\s*/i);start=x[0]||"";end=x[1]||"";} return {start,end,days:Array.isArray(d.consultationDays)?d.consultationDays:(Array.isArray(d.workingDays)?d.workingDays:[])}; }
function getAvailability(){ const d=S.doctor||{},sch=doctorSchedule(),now=new Date(),day=now.toLocaleDateString('en-US',{weekday:'long'}),cur=now.getHours()*60+now.getMinutes(),sm=timeToMinutes(sch.start),em=timeToMinutes(sch.end); const dayOk=!sch.days.length||sch.days.some(x=>String(x).toLowerCase().startsWith(day.slice(0,3).toLowerCase())); return {open:dayOk&&(sm===null||em===null||cur>=sm&&cur<em),day,...sch}; }
function nextAvailableText(){ const a=getAvailability(); if(a.open)return 'Available now'; if(a.days.length)return `Next available: ${a.days[0]}${a.start?' • '+a.start:''}`; return a.start?`Next available: ${a.start}`:'Consultation hours ended'; }

// Fetch the list of doctors patients can choose from
async function loadDoctorsList(){
  if(!fb.ready) return;
  const snap = await fb.db.collection("doctors").where("isActive","==",true).get();
  S.doctorsList = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

// LIVE listener on queue/{doctorId} — this is what makes token tracking real-time
function listenQueue(){
  if(!fb.ready || !selectedDoctorId) return;
  if(S.unsubQueue) S.unsubQueue();
  S.unsubQueue = fb.db.collection("queue").doc(selectedDoctorId).onSnapshot(doc=>{
    S.queueLive = doc.exists ? doc.data() : {currentToken:0,status:"OPEN"};
    maybeNotifyTurn();
    if(S.screen==="token" || S.screen==="home") render();
  });
}

// LIVE listener on this patient's active appointment (so tokenNumber appears the moment operator assigns it)
function listenAppointment(appointmentId){
  if(!fb.ready) return;
  saveAppointmentForPatient(S.selectedPatientId, appointmentId);
  if(S.unsubAppointment) S.unsubAppointment();
  S.unsubAppointment = fb.db.collection("appointments").doc(appointmentId).onSnapshot(doc=>{
    S.appointment = doc.exists ? {id:doc.id, ...doc.data()} : null;
    maybeNotifyTurn();
    render();
  });
}

// Tracks each family patient's own active appointment separately: { patientId: appointmentId }
function getAppointmentMap(){
  try{ return JSON.parse(localStorage.getItem("clinicq_appointments")||"{}"); }catch(e){ return {}; }
}
function saveAppointmentForPatient(patientId, appointmentId){
  if(!patientId) return;
  const map = getAppointmentMap();
  map[patientId] = appointmentId;
  localStorage.setItem("clinicq_appointments", JSON.stringify(map));
}
function clearAppointmentForPatient(patientId){
  const map = getAppointmentMap();
  delete map[patientId];
  localStorage.setItem("clinicq_appointments", JSON.stringify(map));
}

// On app start / patient switch, resume tracking THIS patient's own booked appointment (if any)
async function resumeSavedAppointment(){
  if(S.unsubAppointment){ S.unsubAppointment(); S.unsubAppointment=null; }
  S.appointment = null;
  const map = getAppointmentMap();
  const savedId = map[S.selectedPatientId];
  if(!savedId || !fb.ready) return;
  const doc = await fb.db.collection("appointments").doc(savedId).get();
  if(!doc.exists){ clearAppointmentForPatient(S.selectedPatientId); return; }
  const data = doc.data();
  if(["completed","cancelled","no_show"].includes(data.status)){ clearAppointmentForPatient(S.selectedPatientId); return; }
  selectedDoctorId = data.doctorId;
  await loadDoctor();
  listenQueue();
  listenAppointment(savedId);
}

async function loadPatients(){
  if(!fb.ready){ S.patients=[]; return; }
  const snap = await fb.db.collection("users").doc(S.demoUserId).collection("patients").get();
  S.patients = snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function addPatientToFirestore(p){
  const ref = await fb.db.collection("users").doc(S.demoUserId).collection("patients").add(p);
  return ref.id;
}

// Creates the appointment doc. tokenNumber is intentionally null — operator assigns it later.
async function createAppointment({patient, paymentType, amountPaid}){
  const data = {
    userId:S.demoUserId, patientId:patient.id, patientName:patient.fullName, patientAge:patient.age,
    complaint:patient.complaint||"", doctorId:selectedDoctorId, patientMobile:patient.mobile||"",
    paymentType, amountPaid, paymentStatus:"verified", paymentRef:"DEMO-"+Date.now(),
    tokenNumber:null, status:"waiting_for_token", source:"online",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const ref = await fb.db.collection("appointments").add(data);
  return ref.id;
}

/* =========================================================
   4) SCREENS
   ========================================================= */
function header(title=""){return `<header><div class="logo">Clinic<span>Q</span></div>
<div style="display:flex;align-items:center;gap:10px">
${title?`<div class="small" style="font-weight:700">${esc(title)}</div>`:""}
<button onclick="setScreen('profile')" style="background:none;padding:8px;color:var(--dark)" aria-label="Profile menu">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
</button></div></header>`}

const ICONS = {
  home:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>',
  search:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  ticket:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4V8z"/><path d="M13 6v12" stroke-dasharray="2 3"/></svg>'
};
function nav(active){
  const near = S.appointment && S.appointment.tokenNumber && S.queueLive && (S.appointment.tokenNumber - S.queueLive.currentToken) <= 2;
  const item=(key,icon,label,onclick)=>`<button class="${active===key?'active':''}" style="position:relative" onclick="${onclick}">${icon}<span>${label}</span>${key==='token'&&near?'<span class="navDot"></span>':''}</button>`;
  return `<div class="nav">
  ${item('home',ICONS.home,'Home',"goHome()")}
  ${item('doctors',ICONS.search,'Find Doctor',"goDoctorsList()")}
  ${item('token',ICONS.ticket,'My Token',"setScreen('token')")}
  </div>`;
}

async function goHome(){
  await resumeSavedAppointment();
  setScreen("home");
}
async function goDoctorsList(){
  await loadDoctorsList();
  setScreen("doctorsList");
}
async function chooseDoctor(id){
  selectedDoctorId = id;
  await loadDoctor();
  listenQueue();
  setScreen("doctor");
}

// Browser notification (reminder) — works only while this browser/tab has permission granted.
// This is not a native phone alarm, but shows an alert + sound similar to one.
let notifiedTokens = new Set();
function requestNotifyPermission(){
  if(!("Notification" in window)){ alert("Notifications not supported on this browser."); return; }
  Notification.requestPermission().then(p=>{ render(); });
}
function maybeNotifyTurn(){
  if(!S.appointment || !S.appointment.tokenNumber || !S.queueLive) return;
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  const ahead = S.appointment.tokenNumber - S.queueLive.currentToken;
  const key = S.appointment.id+"_"+S.appointment.tokenNumber;
  if(ahead<=2 && ahead>=0 && !notifiedTokens.has(key)){
    notifiedTokens.add(key);
    new Notification("ClinicQ — Your turn is approaching", {
      body: `Token #${S.appointment.tokenNumber} — Current token #${S.queueLive.currentToken}. Please start heading to the clinic.`
    });
  }
}

function render(){
  const a = document.getElementById("app");
  let html = "";
  if(S.screen==="splash") html = splashView();
  else if(S.screen==="selectPatient") html = selectPatientView();
  else if(S.screen==="addPatient") html = addPatientView();
  else if(S.screen==="home") html = homeView();
  else if(S.screen==="doctorsList") html = doctorsListView();
  else if(S.screen==="doctor") html = doctorView();
  else if(S.screen==="book") html = bookView();
  else if(S.screen==="payment") html = paymentView();
  else if(S.screen==="waiting") html = waitingView();
  else if(S.screen==="token") html = tokenView();
  else if(S.screen==="profile") html = profileView();
  a.innerHTML = `<div class="app">${html}</div>`;
}

function splashView(){
  return `<div class="splash">
  <div style="font-size:64px;color:#17324d;line-height:1">⚕</div>
  <div class="logo">Clinic<span>Q</span></div>
  <p><b>अब इंतज़ार हुआ खत्म, सीधे घर से पहुँचें डॉक्टर के पास।</b><br>No More Waiting. Reach Your Doctor from Home at the Right Time.</p>
  <p>लाइन में नहीं, घर से करें इंतज़ार।<br><b>Don't Wait in Line, Wait from Home.</b></p>
  <button class="primary big" onclick="startApp()">Get Started</button></div>`;
}
async function startApp(){
  await loadPatients();
  setScreen(S.patients.length ? "selectPatient" : "addPatient");
}

function selectPatientView(){
  return `<div class="screen"><h1>Who is the appointment for?</h1>
  <p class="small">Tap to select • Press & hold to delete</p>
  ${S.patients.map(p=>`<div class="card" style="cursor:pointer"
    onmousedown="patientHoldStart('${p.id}')" onmouseup="patientHoldEnd()" onmouseleave="patientHoldEnd()"
    ontouchstart="patientHoldStart('${p.id}')" ontouchend="patientHoldEnd()"
    onclick="patientCardClick('${p.id}')">
    <b>${esc(p.relation)} – ${esc(p.fullName)}</b><p>Age ${p.age} • ${esc(p.gender)}</p></div>`).join("")}
  <button class="secondary big" onclick="setScreen('addPatient')">+ Add New Patient</button></div>`;
}
let longPressTimer=null, longPressFired=false;
function patientHoldStart(id){
  longPressFired=false;
  longPressTimer=setTimeout(()=>{ longPressFired=true; confirmDeletePatient(id); }, 600);
}
function patientHoldEnd(){ clearTimeout(longPressTimer); }
function patientCardClick(id){
  if(longPressFired){ longPressFired=false; return; }
  choosePatient(id);
}
async function confirmDeletePatient(id){
  const p = S.patients.find(x=>x.id===id);
  if(!confirm(`Delete patient "${p?.fullName||''}"?\nThis cannot be undone.`)) return;
  await fb.db.collection("users").doc(S.demoUserId).collection("patients").doc(id).delete();
  S.patients = S.patients.filter(x=>x.id!==id);
  clearAppointmentForPatient(id);
  if(S.selectedPatientId===id) S.selectedPatientId=null;
  render();
}
function choosePatient(id){ S.selectedPatientId=id; goHome(); }

function addPatientView(){
  return `<div class="screen"><h1>Add Patient</h1>
  <label>Relation</label><input id="rel" placeholder="Myself / Father / Mother">
  <label>Full Name</label><input id="pf">
  <label>Age</label><input id="pa" type="number">
  <label>Gender</label><select id="pg"><option>Male</option><option>Female</option><option>Other</option></select>
  <label>Mobile Number</label><input id="pm">
  <label>Complaint / Problem</label><textarea id="pc"></textarea>
  <button class="primary big" onclick="submitAddPatient()">Save & Continue</button></div>`;
}
async function submitAddPatient(){
  const p = {relation:document.getElementById("rel").value||"Myself", fullName:document.getElementById("pf").value,
    age:+document.getElementById("pa").value||0, gender:document.getElementById("pg").value,
    mobile:document.getElementById("pm").value, complaint:document.getElementById("pc").value};
  if(!p.fullName) return alert("Enter patient name");
  if(!fb.ready){ alert("Firebase not connected yet — data won't be saved. Add your config at the top of this file first."); return; }
  const id = await addPatientToFirestore(p);
  S.patients.push({id, ...p});
  S.selectedPatientId = id;
  goHome();
}

function homeView(){
  return `${header("Home")}<div class="screen">${S.appointment ? appointmentCard() : `<div class="statusHero slideUp"><div class="liveBadge" style="background:#ffffff20;color:#fff"><span class="liveDot"></span>CLINICQ LIVE</div><h1 style="color:#fff;margin-top:12px">No active appointment</h1><p>Choose a doctor and book your place in the queue from home.</p><button style="background:#fff;color:#1769ff" class="big" onclick="goDoctorsList()">Find a Doctor →</button></div>`}</div>${nav('home')}`;
}


function appointmentCard(){
  const ap=S.appointment,assigned=!!ap.tokenNumber,near=assigned&&S.queueLive&&(ap.tokenNumber-S.queueLive.currentToken)<=2,ahead=assigned&&S.queueLive?Math.max(0,ap.tokenNumber-S.queueLive.currentToken):null,progress=assigned&&S.queueLive?Math.max(5,Math.min(100,100-ahead*18)):8;
  return `<div class="statusHero slideUp ${near?'pulseRing':''}"><div style="display:flex;justify-content:space-between;align-items:center"><div class="liveBadge" style="background:#ffffff20;color:#fff"><span class="liveDot"></span>LIVE QUEUE</div><span class="small" style="color:#fff">${esc(ap.status||'Waiting')}</span></div><h2 style="color:#fff;margin-top:15px">${esc(S.doctor?.name||'Your Doctor')}</h2><p>${assigned?`Token #${ap.tokenNumber} • ${ahead===0?'Your turn now':ahead+' patient'+(ahead===1?'':'s')+' ahead'}`:'Booking confirmed — waiting for token assignment'}</p>${assigned?`<div class="progressTrack" style="background:#ffffff30"><div class="progressBar" style="width:${progress}%;background:#fff"></div></div><div style="display:flex;justify-content:space-between;font-size:12px;color:#eaf2ff"><span>Current #${S.queueLive?.currentToken??'–'}</span><span>Estimated ${waitMinutes(ap.tokenNumber)} min</span></div>`:''}<button style="background:#fff;color:#1769ff;width:100%;margin-top:15px" onclick="setScreen('token')">Track Live Queue →</button></div><div class="card slideUp"><div class="kpi"><span>Patient</span><b>${esc(selectedPatient()?.fullName||'')}</b></div><div class="kpi"><span>Clinic</span><b>${esc(S.doctor?.clinicName||'')}</b></div><div class="kpi"><span>Consultation</span><b>₹${S.doctor?.consultationFee||0}</b></div></div>`;
}


function initials(name){ return (name||"").replace(/^Dr\.?\s*/i,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function doctorsListView(){
  const q = (S.doctorSearch||"").toLowerCase();
  const filtered = S.doctorsList.filter(d=>!q || (d.name||"").toLowerCase().includes(q) || (d.specialty||"").toLowerCase().includes(q));
  return `${header("Find Doctor")}<div class="screen">
  <input placeholder="Search by doctor name or specialty" value="${esc(S.doctorSearch||"")}" oninput="S.doctorSearch=this.value;render()" style="margin-bottom:14px">
  ${filtered.map(d=>`<div class="card doctor" style="cursor:pointer" onclick="chooseDoctor('${d.id}')">
  <div class="avatarG">${initials(d.name)}</div>
  <div style="flex:1"><h3 style="margin-bottom:2px">${esc(d.name)}</h3><span class="tag" style="margin:2px 0">${esc(d.specialty)}</span>
  <p class="small" style="margin-top:6px">${esc(d.clinicName)} • Total ₹${(d.consultationFee+d.platformFee)}</p></div></div>`).join("") || `<p>No doctors match your search.</p>`}
  </div>${nav('doctors')}`;
}

function doctorView(){
  if(!S.doctor) return `${header("Find Doctor")}<div class="screen"><p>Loading…</p></div>${nav('doctors')}`;
  const d=S.doctor,av=getAvailability(),sch=doctorSchedule();
  return `${header("Doctor")}<div class="screen"><div class="card doctor slideUp"><div class="avatarG">${initials(d.name)}</div><div><h3>${esc(d.name)}</h3><span class="tag">${esc(d.specialty)}</span><div class="doctorOnline" style="margin-top:6px"><i></i>${av.open?'Available now':'Currently unavailable'}</div>${(d.qualifications||[]).map(q=>`<div class="small" style="margin-top:4px">${esc(q)}</div>`).join('')}<p class="small">${esc(d.experience)}</p></div></div><div class="card"><div class="kpi"><span>Clinic</span><b>${esc(d.clinicName)}</b></div><div class="kpi"><span>Hours</span><b>${esc(sch.start&&sch.end?sch.start+' – '+sch.end:d.workingHours||'Not set')}</b></div><div class="kpi"><span>Days</span><b>${esc(sch.days.join(', ')||'As per clinic schedule')}</b></div><div class="kpi"><span>Current Token</span><span style="display:flex;align-items:center;gap:8px"><span class="liveBadge"><span class="liveDot"></span>LIVE</span><b>#${S.queueLive?.currentToken ?? '–'}</b></span></div><div class="kpi"><span>Consultation</span><b>${d.avgConsultationMinutes||5} min</b></div><div class="kpi"><span>Total Amount</span><b>₹${(d.consultationFee+d.platformFee)}</b></div></div>${!av.open?`<div class="nextSlot"><b>Consultation hours ended</b><p>${nextAvailableText()}</p></div>`:''}<button class="primary big" onclick="tryBookAppointment()">${av.open?'Book Appointment':'Book for Next Available →'}</button><button class="outline big" onclick="emergency()">Emergency Help</button><button class="outline big" onclick="window.open('?tv='+selectedDoctorId,'_blank')">📺 Launch TV Mode</button></div>${nav('doctors')}`;
}


function hasActiveAppointment(){
  return S.appointment && S.appointment.doctorId===selectedDoctorId && !["completed","cancelled","no_show"].includes(S.appointment.status);
}
function tryBookAppointment(){
  if(hasActiveAppointment()){
    alert("You already have an active appointment with this doctor.\nStatus: "+S.appointment.status+(S.appointment.tokenNumber?"\nToken: #"+S.appointment.tokenNumber:"")+"\n\nGo to 'My Token' to track it.");
    setScreen('token');
    return;
  }
  setScreen('book');
}
function emergency(){ alert("Emergency contact is admin-configured. For real emergencies, contact appropriate emergency medical services."); }

function bookView(){
  if(hasActiveAppointment()){
    return `${header("Already Booked")}<div class="screen"><div class="alert">You already have an active appointment.<br>Status: ${esc(S.appointment.status)}${S.appointment.tokenNumber?"<br>Token: #"+S.appointment.tokenNumber:""}</div>
    <button class="primary big" onclick="setScreen('token')">Go to My Token</button></div>${nav('doctors')}`;
  }
  const p = selectedPatient();
  if(!p) return `${header()}<div class="screen"><p>Select a patient first.</p><button class="primary" onclick="setScreen('selectPatient')">Select Patient</button></div>`;
  return `${header("Book Appointment")}<div class="screen">
  <div class="card">
  <div class="kpi"><span>Patient</span><b>${esc(p.fullName)}</b></div>
  <div class="kpi"><span>Doctor</span><b>${esc(S.doctor.name)}</b></div>
  <div class="kpi"><span>Complaint</span><b>${esc(p.complaint||"-")}</b></div>
  </div>
  <h3>Payment Options</h3>
  <button class="primary big" onclick="S.payType='online';setScreen('payment')">Pay Consultation Online — ₹${S.doctor.consultationFee+S.doctor.platformFee}</button>
  <button class="secondary big" onclick="S.payType='cash';setScreen('payment')">Cash at Clinic (Pay ₹${S.doctor.serviceFee} service fee online)</button>
  </div>${nav('doctors')}`;
}

function paymentView(){
  const d=S.doctor, online = S.payType==="online";
  const amount = online ? (d.consultationFee+d.platformFee) : d.serviceFee;
  return `${header("Payment")}<div class="screen">
  <div class="card">
  ${online ? `<div class="kpi"><span>Total Payable</span><b>₹${amount}</b></div>` :
  `<div class="kpi"><span>Doctor Fee</span><b>₹${d.consultationFee} – Cash at Clinic</b></div><div class="kpi"><span>ClinicQ Service Fee</span><b>₹${amount} – Pay Online</b></div>
  <p>${'यह ₹'+d.serviceFee+' शुल्क ClinicQ की queue-management service के लिए है — आपको clinic में घंटों इंतज़ार नहीं करना पड़ेगा।'}</p>`}
  </div>
  <button class="primary big" onclick="doPayment('${online?'online':'cash_at_clinic'}', ${amount})">Pay Now (Demo) — ₹${amount}</button>
  </div>${nav('doctors')}`;
}

async function doPayment(paymentType, amount){
  if(!fb.ready){ alert("Firebase not connected yet — connect it first to save real appointments."); return; }
  const p = selectedPatient();
  const id = await createAppointment({patient:p, paymentType, amountPaid:amount});
  listenAppointment(id);
  setScreen("waiting");
}

function waitingView(){
  return `${header("Payment Successful")}<div class="screen">
  <div class="success">Payment Successful ✓</div>
  <div class="card">
  <h3>Appointment Request Submitted</h3>
  <p>Your payment has been received. The clinic operator will assign your token number according to the current clinic queue.</p>
  <div class="kpi"><span>Status</span><span class="tag warning">${esc(S.appointment?.status||"waiting_for_token")}</span></div>
  </div>
  <button class="primary big" onclick="setScreen('token')">Go to My Token</button>
  </div>${nav('token')}`;
}

async function trackByMobile(){
  const mobile = document.getElementById("trackMobile").value.trim();
  const err = document.getElementById("trackErr");
  err.textContent = "";
  if(!mobile){ err.textContent="Enter mobile number"; return; }
  const snap = await fb.db.collection("appointments").where("patientMobile","==",mobile).get();
  let results = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(a=>!["completed","cancelled","no_show"].includes(a.status));
  if(!results.length){ err.textContent="No active appointment found for this number."; return; }
  results.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const ap = results[0];
  selectedDoctorId = ap.doctorId;
  await loadDoctor();
  listenQueue();
  listenAppointment(ap.id);
}

function tokenView(){
  if(!S.appointment) return `${header("My Token")}<div class="screen"><p>No active appointment yet.</p><div class="card"><h3>Walk-in patient? Track your token</h3><label>Mobile Number</label><input id="trackMobile" placeholder="Enter mobile number used at clinic"><button class="primary big" onclick="trackByMobile()">Find My Token</button><div id="trackErr" class="small" style="color:#b42318;margin-top:8px"></div></div></div>${nav('token')}`;
  const ap=S.appointment,q=S.queueLive,assigned=!!ap.tokenNumber,ahead=assigned&&q?Math.max(0,ap.tokenNumber-q.currentToken):null;
  return `${header("My Token")}<div class="screen">${assigned?`<div class="card center liveCard tokenPop"><div class="liveBadge"><span class="liveDot"></span>LIVE • QUEUE UPDATES AUTOMATICALLY</div><div class="token">#${ap.tokenNumber}</div><div class="tokenLabel">Your Token</div>${ahead===0?`<div class="success" style="margin-top:15px"><b>🎉 It's your turn!</b><br>Please proceed to the doctor.</div>`:`<div class="card muted" style="margin:14px 0 0"><div class="kpi"><span>Current Token</span><b>#${q?.currentToken??'–'}</b></div><div class="kpi"><span>Patients Ahead</span><b>${ahead}</b></div><div class="kpi"><span>Estimated Wait</span><b>${waitMinutes(ap.tokenNumber)} min</b></div><div class="progressTrack"><div class="progressBar" style="width:${Math.max(5,Math.min(100,100-ahead*18))}%"></div></div><div class="small">We’ll update this screen live.</div></div>`}</div><div class="card slideUp"><div class="queueStep" style="display:flex;align-items:center;gap:10px;padding:10px 0"><span style="width:11px;height:11px;border-radius:50%;background:#1769ff"></span><div><b>Booking confirmed</b><div class="small">Your appointment is active</div></div></div><div class="queueStep" style="display:flex;align-items:center;gap:10px;padding:10px 0"><span style="width:11px;height:11px;border-radius:50%;background:${ahead===0?'#1db954':'#d9e2eb'}"></span><div><b>Waiting in queue</b><div class="small">Current token #${q?.currentToken??'–'}</div></div></div><div class="queueStep" style="display:flex;align-items:center;gap:10px;padding:10px 0"><span style="width:11px;height:11px;border-radius:50%;background:#d9e2eb"></span><div><b>Consultation</b><div class="small">You’ll be notified when called</div></div></div></div>${("Notification" in window&&Notification.permission!=="granted")?`<button class="outline big" onclick="requestNotifyPermission()">🔔 Enable Turn Reminder</button>`:''}`:`<div class="alert">Waiting for the clinic operator to assign your token. This screen updates automatically — no need to refresh.</div>`}</div>${nav('token')}`;
}


function profileView(){
  const p=S.patients.find(x=>x.id===S.selectedPatientId);
  return `${header("Profile")}<div class="screen"><div class="card"><b>${p?esc(p.fullName):"No patient selected"}</b>${p?`<p>Age ${p.age} • ${esc(p.gender)} • ${esc(p.mobile)}</p>`:''}</div><button class="outline big" onclick="setScreen('selectPatient')">Switch / Add Family Patient</button><button class="outline big" onclick="goDoctorsList()">Find a Doctor</button><button class="outline big" onclick="alert('Settings: notifications, queue reminders and app preferences.')">⚙ Settings</button><button class="danger big" onclick="localStorage.removeItem('clinicq_demo_uid');location.reload()">Logout</button></div>${nav('')}`;
}


// TV Mode — standalone display for a clinic monitor. Opened via ?tv=<doctorId>, no login/patient flow needed.
let tvDoctor=null, tvQueue={currentToken:0,status:"OPEN"};
function tvView(){
  return `<div class="tv">
  <div class="logo">Clinic<span>Q</span> — Live Queue</div>
  <div class="clinicName">${esc(tvDoctor?.clinicName||"")} • ${esc(tvDoctor?.name||"")}</div>
  <div class="nowLabel">NOW SERVING</div>
  <div class="nowNum">#${tvQueue.currentToken}</div>
  <div class="nextRow"><div class="nextBox"><div class="nextLabel">NEXT</div><div class="nextNum">#${tvQueue.currentToken+1}</div></div></div>
  <div class="tvFooter">Please wait for your token number to be called.</div>
  </div>`;
}
async function initTvMode(doctorId){
  document.getElementById("app").innerHTML = tvView();
  if(!fb.ready) return;
  const doc = await fb.db.collection("doctors").doc(doctorId).get();
  tvDoctor = doc.exists ? doc.data() : null;
  fb.db.collection("queue").doc(doctorId).onSnapshot(d=>{
    tvQueue = d.exists ? d.data() : {currentToken:0,status:"OPEN"};
    document.getElementById("app").innerHTML = tvView();
  });
}

const tvParam = new URLSearchParams(location.search).get("tv");
if(tvParam){
  initTvMode(tvParam);
} else {
  render();
}
</script>
</body>
</html>
